<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Thread — pick up where you left off</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#191B24">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thread">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #191B24;
    --ink-soft: #23252F;
    --paper: #F7F4EC;
    --paper-dim: #EDE9DD;
    --gold: #C99A3B;
    --gold-soft: rgba(201,154,59,0.16);
    --pine: #4F7963;
    --pine-soft: rgba(79,121,99,0.18);
    --text-dark: #22221D;
    --text-mute: #6B6A5F;
    --text-light: #EDE9DD;
    --danger: #B4553F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,154,59,0.08), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(79,121,99,0.10), transparent 40%);
    color: var(--text-light);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    padding: 28px 20px 100px;
    position:relative;
  }
  header{ margin-bottom: 28px; }
  header h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text-light);
  }
  header p{
    margin:0;
    font-size: 14px;
    line-height:1.5;
    color: #A9A79A;
    max-width: 34ch;
  }

  /* Capture box */
  .capture{
    margin: 8px 0 30px;
  }
  .capture-box{
    display:flex;
    align-items:flex-end;
    gap: 10px;
    background: var(--ink-soft);
    border: 1px solid #3A3C48;
    border-radius: 16px;
    padding: 12px 12px 12px 16px;
  }
  .capture-box:focus-within{
    border-color: var(--gold);
  }
  .capture-box textarea{
    flex:1;
    resize:none;
    border:none;
    background:transparent;
    color: var(--text-light);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height:1.5;
    padding: 6px 0;
    outline:none;
  }
  .capture-box textarea::placeholder{ color:#6E6C60; }
  .capture-box button{
    flex-shrink:0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border:none;
    background: var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .capture-box button:active{ transform: scale(0.9); }
  .capture-box button svg{ width:18px; height:18px; }
  .capture-hint{
    margin-top: 10px;
    font-size: 12.5px;
    color: #8C8A7C;
    line-height:1.5;
    padding-left: 2px;
  }
  .saved-flash{
    color: var(--pine) !important;
  }

  /* Threads list */
  .section-label{
    font-size: 12px;
    color: #8C8A7C;
    margin: 6px 2px 12px;
  }
  .threads{ display:flex; flex-direction:column; gap: 12px; }

  .thread-card{
    background: var(--paper);
    border-radius: 14px;
    padding: 16px 16px 14px;
    color: var(--text-dark);
    position:relative;
    border-left: 4px solid var(--gold);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .thread-card.done{
    border-left-color: var(--pine);
    opacity: 0.6;
  }
  .thread-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 10px;
  }
  .thread-cue{
    font-family:'Source Serif 4', serif;
    font-weight: 500;
    font-size: 17px;
    line-height:1.35;
    margin:0;
    cursor:pointer;
  }
  .thread-time{
    font-size: 11px;
    color: var(--text-mute);
    white-space:nowrap;
    margin-top: 3px;
  }
  .thread-note{
    display:none;
    font-size: 13.5px;
    line-height:1.5;
    color: var(--text-mute);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--paper-dim);
  }
  .thread-note.open{ display:block; }
  .thread-actions{
    display:flex;
    justify-content:flex-end;
    gap: 14px;
    margin-top: 10px;
  }
  .thread-actions button{
    border:none;
    background:none;
    font-size: 12px;
    font-weight: 600;
    cursor:pointer;
    padding: 4px 2px;
  }
  .btn-done{ color: var(--pine); }
  .btn-remove{ color: var(--text-mute); }

  .empty{
    text-align:center;
    padding: 30px 10px;
    color: #7C7A6E;
    font-size: 13.5px;
    line-height:1.6;
  }
  .empty strong{ color:#A9A79A; display:block; margin-bottom:4px; font-family:'Source Serif 4', serif; font-size:16px; font-weight:600;}

  .unsupported{
    font-size: 12px;
    color: #8C8A7C;
    background: var(--ink-soft);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 12px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Thread</h1>
    <p>Getting pulled away? Say where your head's at. Come back and pick the thread right back up.</p>
  </header>

  <div class="capture">
    <div class="capture-box">
      <textarea id="typeArea" placeholder="Tap here, then tap the mic on your keyboard and just talk…" rows="2"></textarea>
      <button id="typeSave" aria-label="Save thread">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#191B24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="capture-hint">Your keyboard's mic icon dictates hands-free — no app permissions needed.</div>
  </div>

  <div class="section-label" id="listLabel">Open threads</div>
  <div class="threads" id="threadList"></div>
</div>

<script>
(function(){
  const threadList = document.getElementById('threadList');
  const listLabel = document.getElementById('listLabel');
  const typeArea = document.getElementById('typeArea');
  const typeSave = document.getElementById('typeSave');
  const captureHint = document.querySelector('.capture-hint');
  const defaultHint = captureHint.textContent;

  const STORAGE_KEY = 'threads';
  let threads = [];
  const FILLERS = /\b(um+|uh+|like|so basically|basically|you know|kind of|sort of|actually|just)\b/gi;

  function makeCue(raw){
    let t = raw.trim().replace(FILLERS, ' ').replace(/\s+/g, ' ').trim();
    if(!t) return 'Untitled thread';
    // take up through first strong clause break, cap length
    let cue = t.split(/[.;]\s|\s—\s/)[0];
    if(cue.length > 58){ cue = cue.slice(0, 55).trim() + '…'; }
    return cue.charAt(0).toUpperCase() + cue.slice(1);
  }

  function timeAgo(ts){
    const diff = Math.floor((Date.now() - ts) / 1000);
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  async function loadThreads(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      threads = raw ? JSON.parse(raw) : [];
    }catch(e){
      threads = [];
    }
    render();
  }

  async function saveThreads(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(threads));
    }catch(e){ console.error('save failed', e); }
  }

  function addThread(rawText){
    if(!rawText || !rawText.trim()) return;
    threads.unshift({
      id: 't' + Date.now(),
      note: rawText.trim(),
      cue: makeCue(rawText),
      time: Date.now(),
      done: false
    });
    saveThreads();
    render();
  }

  function toggleDone(id){
    const th = threads.find(t => t.id === id);
    if(th) th.done = !th.done;
    saveThreads();
    render();
  }

  function removeThread(id){
    threads = threads.filter(t => t.id !== id);
    saveThreads();
    render();
  }

  function render(){
    threadList.innerHTML = '';
    const open = threads.filter(t => !t.done);
    const done = threads.filter(t => t.done);
    listLabel.textContent = open.length ? `Open thread${open.length>1?'s':''} (${open.length})` : 'Open threads';

    if(threads.length === 0){
      threadList.innerHTML = `<div class="empty"><strong>Nothing dropped yet</strong>When you get pulled away mid-task, tap the button and say where you were. It'll be waiting here.</div>`;
      return;
    }

    const ordered = [...open, ...done];
    ordered.forEach(th => {
      const card = document.createElement('div');
      card.className = 'thread-card' + (th.done ? ' done' : '');
      card.innerHTML = `
        <div class="thread-top">
          <p class="thread-cue">${escapeHtml(th.cue)}</p>
          <div class="thread-time">${timeAgo(th.time)}</div>
        </div>
        <div class="thread-note">${escapeHtml(th.note)}</div>
        <div class="thread-actions">
          <button class="btn-done">${th.done ? 'Reopen' : 'Picked back up'}</button>
          <button class="btn-remove">Remove</button>
        </div>
      `;
      card.querySelector('.thread-cue').addEventListener('click', () => {
        card.querySelector('.thread-note').classList.toggle('open');
      });
      card.querySelector('.btn-done').addEventListener('click', () => toggleDone(th.id));
      card.querySelector('.btn-remove').addEventListener('click', () => removeThread(th.id));
      threadList.appendChild(card);
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function saveFromBox(){
    const val = typeArea.value;
    if(!val || !val.trim()) return;
    addThread(val);
    typeArea.value = '';
    captureHint.textContent = 'Saved.';
    captureHint.classList.add('saved-flash');
    setTimeout(() => {
      captureHint.textContent = defaultHint;
      captureHint.classList.remove('saved-flash');
    }, 1400);
  }

  typeSave.addEventListener('click', saveFromBox);

  // Enter key saves (Shift+Enter for a new line), so it works like a quick-capture box
  typeArea.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      saveFromBox();
    }
  });

  loadThreads();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
