<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JaldiRewind — pick up where you left off</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#191B24">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JaldiRewind">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #191B24;
    --ink-soft: #23252F;
    --paper: #F7F4EC;
    --paper-dim: #EDE9DD;
    --gold: #C99A3B;
    --gold-soft: rgba(201,154,59,0.16);
    --pine: #4F7963;
    --pine-soft: rgba(79,121,99,0.18);
    --text-dark: #22221D;
    --text-mute: #6B6A5F;
    --text-light: #EDE9DD;
    --danger: #B4553F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,154,59,0.08), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(79,121,99,0.10), transparent 40%);
    color: var(--text-light);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    padding: 28px 20px 100px;
    position:relative;
  }
  header{ margin-bottom: 28px; }
  header h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text-light);
  }
  header p{
    margin:0;
    font-size: 14px;
    line-height:1.5;
    color: #A9A79A;
    max-width: 34ch;
  }
  .notif-btn{
    margin-top: 14px;
    background: var(--ink-soft);
    border: 1px solid #3A3C48;
    color: var(--text-light);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
  }
  .notif-btn:disabled{
    opacity: 0.6;
    cursor: default;
  }

  /* Type toggle */
  .type-toggle{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .type-pill{
    border: 1px solid #3A3C48;
    background: transparent;
    color: #A9A79A;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor:pointer;
  }
  .type-pill.active{
    background: var(--gold-soft);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Capture box */
  .capture{
    margin: 8px 0 30px;
  }
  .capture-box{
    display:flex;
    align-items:flex-end;
    gap: 10px;
    background: var(--ink-soft);
    border: 1px solid #3A3C48;
    border-radius: 16px;
    padding: 12px 12px 12px 16px;
  }
  .capture-box:focus-within{
    border-color: var(--gold);
  }
  .capture-box textarea{
    flex:1;
    resize:none;
    border:none;
    background:transparent;
    color: var(--text-light);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height:1.5;
    padding: 6px 0;
    outline:none;
  }
  .capture-box textarea::placeholder{ color:#6E6C60; }
  .capture-box button{
    flex-shrink:0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border:none;
    background: var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .capture-box button:active{ transform: scale(0.9); }
  .capture-box button svg{ width:18px; height:18px; }
  .remind-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-top:12px;
  }
  .remind-label{ font-size:12px; color:#8C8A7C; margin-right:2px; }
  .chip{
    border:1px solid #3A3C48; background:transparent; color:#A9A79A;
    font-family:'IBM Plex Sans',sans-serif; font-size:12px; font-weight:500;
    padding:5px 11px; border-radius:999px; cursor:pointer;
  }
  .chip.active{ background:var(--gold-soft); border-color:var(--gold); color:var(--gold); }
  .custom-row{
    display:none; align-items:center; gap:8px; margin-top:8px;
    font-size:12.5px; color:#A9A79A;
  }
  .custom-row input{
    width:90px; background:var(--ink-soft); border:1px solid #3A3C48; color:var(--text-light);
    border-radius:10px; padding:6px 10px; font-size:14px; font-family:'IBM Plex Sans',sans-serif;
  }
  .thread-remind{ font-size:12px; color:var(--text-mute); margin-top:6px; }
  .capture-hint{
    margin-top: 10px;
    font-size: 12.5px;
    color: #8C8A7C;
    line-height:1.5;
    padding-left: 2px;
  }
  .saved-flash{
    color: var(--pine) !important;
  }

  /* Threads list */
  .section-label{
    font-size: 12px;
    color: #8C8A7C;
    margin: 6px 2px 12px;
  }
  .threads{ display:flex; flex-direction:column; gap: 12px; }

  .thread-card{
    background: var(--paper);
    border-radius: 14px;
    padding: 16px 16px 14px;
    color: var(--text-dark);
    position:relative;
    border-left: 4px solid var(--gold);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .thread-card.done{
    border-left-color: var(--pine);
    opacity: 0.6;
  }
  .thread-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 10px;
  }
  .thread-cue{
    font-family:'Source Serif 4', serif;
    font-weight: 500;
    font-size: 17px;
    line-height:1.35;
    margin:0;
    cursor:pointer;
  }
  .thread-time{
    font-size: 11px;
    color: var(--text-mute);
    white-space:nowrap;
    margin-top: 3px;
  }
  .thread-note{
    display:none;
    font-size: 13.5px;
    line-height:1.5;
    color: var(--text-mute);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--paper-dim);
  }
  .thread-note.open{ display:block; }
  .thread-actions{
    display:flex;
    justify-content:flex-end;
    gap: 14px;
    margin-top: 10px;
  }
  .thread-actions button{
    border:none;
    background:none;
    font-size: 12px;
    font-weight: 600;
    cursor:pointer;
    padding: 4px 2px;
  }
  .btn-done{ color: var(--pine); }
  .btn-remove{ color: var(--text-mute); }

  .thread-card.aged{
    border-left-color: var(--danger);
  }
  .thread-card.aged .thread-time{
    color: var(--danger);
    font-weight: 600;
  }

  .empty{
    text-align:center;
    padding: 30px 10px;
    color: #7C7A6E;
    font-size: 13.5px;
    line-height:1.6;
  }
  .empty strong{ color:#A9A79A; display:block; margin-bottom:4px; font-family:'Source Serif 4', serif; font-size:16px; font-weight:600;}

  .unsupported{
    font-size: 12px;
    color: #8C8A7C;
    background: var(--ink-soft);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 12px;
    line-height:1.5;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>JaldiRewind</h1>
    <p>Getting pulled away? Say where your head's at. Come back and pick it right back up.</p>
    <button id="enableNotifs" class="notif-btn">🔔 Turn on reminders</button>
  </header>

  <div class="capture">
    <div class="type-toggle">
      <button class="type-pill active" id="pillThread" data-type="thread">Thread</button>
      <button class="type-pill" id="pillDecision" data-type="decision">Decision</button>
    </div>
    <div class="capture-box">
      <textarea id="typeArea" placeholder="Tap here, then tap the mic on your keyboard and just talk…" rows="2"></textarea>
      <button id="typeSave" aria-label="Save thread">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#191B24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="remind-row" id="remindRow">
      <span class="remind-label">Remind me in</span>
      <button class="chip" data-mins="5">5 min</button>
      <button class="chip" data-mins="10">10 min</button>
      <button class="chip" data-mins="30">30 min</button>
      <button class="chip" data-mins="60">1 hr</button>
      <button class="chip" data-mins="180">3 hr</button>
      <button class="chip" data-mins="1440">1 day</button>
      <button class="chip" data-mins="custom">Custom</button>
      <button class="chip" data-mins="off">Off</button>
    </div>
    <div class="custom-row" id="customRow">
      <input type="number" id="customMins" min="1" max="10080" inputmode="numeric" placeholder="e.g. 45">
      <span>minutes</span>
    </div>
    <div class="capture-hint" id="captureHint">Your keyboard's mic icon dictates hands-free — no app permissions needed.</div>
  </div>

  <div class="section-label" id="threadLabel">Open threads</div>
  <div class="threads" id="threadList"></div>

  <div class="section-label" id="decisionLabel" style="margin-top:26px;">Decisions pending</div>
  <div class="threads" id="decisionList"></div>
</div>

<script>
(function(){
  const threadList = document.getElementById('threadList');
  const decisionList = document.getElementById('decisionList');
  const threadLabel = document.getElementById('threadLabel');
  const decisionLabel = document.getElementById('decisionLabel');
  const typeArea = document.getElementById('typeArea');
  const typeSave = document.getElementById('typeSave');
  const captureHint = document.getElementById('captureHint');
  const pillThread = document.getElementById('pillThread');
  const pillDecision = document.getElementById('pillDecision');
  const remindRow = document.getElementById('remindRow');
  const customRow = document.getElementById('customRow');
  const customMins = document.getElementById('customMins');

  // Reminder choice (minutes, 'custom' or 'off'); remembered between visits
  let remindChoice = '30';
  try{ remindChoice = localStorage.getItem('remind_choice') || '30'; }catch(e){}
  function paintChips(){
    remindRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.mins === remindChoice));
    customRow.style.display = remindChoice === 'custom' ? 'flex' : 'none';
  }
  remindRow.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if(!b) return;
    remindChoice = b.dataset.mins;
    try{ localStorage.setItem('remind_choice', remindChoice); }catch(_){}
    paintChips();
    if(remindChoice === 'custom') customMins.focus();
  });
  paintChips();

  // -1 = no reminder, otherwise the time (ms) the reminder is due
  function computeRemindAt(){
    if(remindChoice === 'off') return -1;
    let mins = remindChoice === 'custom' ? parseInt(customMins.value, 10) : parseInt(remindChoice, 10);
    if(!mins || mins < 1) mins = 30;
    return Date.now() + mins * 60000;
  }

  const HINTS = {
    thread: "Your keyboard's mic icon dictates hands-free — no app permissions needed.",
    decision: "Log a choice you're putting off. We'll nudge you if it sits too long."
  };
  const PLACEHOLDERS = {
    thread: "Tap here, then tap the mic on your keyboard and just talk…",
    decision: "e.g. Cancel the gym membership or keep it?"
  };

  const STORAGE_KEY = 'threads';
  let entries = [];
  let activeType = 'thread';
  const FILLERS = /\b(um+|uh+|like|so basically|basically|you know|kind of|sort of|actually|just)\b/gi;
  const AGE_NUDGE_MS = 3 * 24 * 60 * 60 * 1000; // 3 days

  function makeCue(raw){
    let t = raw.trim().replace(FILLERS, ' ').replace(/\s+/g, ' ').trim();
    if(!t) return 'Untitled';
    let cue = t.split(/[.;]\s|\s—\s/)[0];
    if(cue.length > 58){ cue = cue.slice(0, 55).trim() + '…'; }
    return cue.charAt(0).toUpperCase() + cue.slice(1);
  }

  function formatWhen(ts){
    const d = new Date(ts);
    const t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    return d.toDateString() === new Date().toDateString()
      ? t
      : d.toLocaleDateString([], { month:'short', day:'numeric' }) + ', ' + t;
  }

  function savedMessage(entry){
    if(!entry || !(entry.remindAt > 0)) return entry && entry.remindAt < 0 ? 'Saved. No reminder set.' : 'Saved.';
    if(!('Notification' in window) || Notification.permission !== 'granted'){
      return 'Saved. Tap “Turn on reminders” at the top to get notified at ' + formatWhen(entry.remindAt) + '.';
    }
    return 'Saved. Reminder at ' + formatWhen(entry.remindAt) + '.';
  }

  function timeAgo(ts){
    const diff = Math.floor((Date.now() - ts) / 1000);
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  async function loadThreads(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : [];
      // backfill type for anything saved before this feature existed
      entries.forEach(e => { if(!e.type) e.type = 'thread'; });
    }catch(e){
      entries = [];
    }
    render();
  }

  async function saveThreads(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){ console.error('save failed', e); }
    syncToBackend();
  }

  // --- Sync entries + push token to the Apps Script backend (debounced) ---
  // PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL BELOW, between the quotes.
  // Leave it empty to skip syncing (app still works fully offline/locally without it).
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvYQkmlW8rGL_lg3oNvTECNaHVz_wiq0c4C7Xe8ATDdrFS7Aph6SwTTspyHkYtuKcD/exec";

  let syncTimer = null;
  function syncToBackend(){
    if(!APPS_SCRIPT_URL) return;
    const token = fcmToken || localStorage.getItem('fcm_token');
    if(!token) return; // nothing to notify without a push token
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight to Apps Script
        body: JSON.stringify({ token, entries })
      }).catch(err => console.error('sync failed', err));
    }, 1500);
  }

  function addThread(rawText, type){
    if(!rawText || !rawText.trim()) return;
    entries.unshift({
      id: 't' + Date.now(),
      type: type,
      note: rawText.trim(),
      cue: makeCue(rawText),
      time: Date.now(),
      done: false,
      remindAt: computeRemindAt()
    });
    saveThreads();
    render();
  }

  function toggleDone(id){
    const th = entries.find(t => t.id === id);
    if(th) th.done = !th.done;
    saveThreads();
    render();
  }

  function removeThread(id){
    entries = entries.filter(t => t.id !== id);
    saveThreads();
    render();
  }

  function renderList(container, label, items, type){
    container.innerHTML = '';
    const open = items.filter(t => !t.done);
    const done = items.filter(t => t.done);

    if(type === 'thread'){
      label.textContent = open.length ? `Open thread${open.length>1?'s':''} (${open.length})` : 'Open threads';
    } else {
      label.textContent = open.length ? `Decision${open.length>1?'s':''} pending (${open.length})` : 'Decisions pending';
    }

    if(items.length === 0){
      const emptyText = type === 'thread'
        ? `<strong>Nothing dropped yet</strong>When you get pulled away mid-task, log it and it'll be waiting here.`
        : `<strong>No decisions logged</strong>When you catch yourself putting off a small choice, log it here instead of carrying it around.`;
      container.innerHTML = `<div class="empty">${emptyText}</div>`;
      return;
    }

    const ordered = [...open, ...done];
    ordered.forEach(th => {
      const isAged = type === 'decision' && !th.done && (Date.now() - th.time) > AGE_NUDGE_MS;
      const card = document.createElement('div');
      card.className = 'thread-card' + (th.done ? ' done' : '') + (isAged ? ' aged' : '');
      const doneLabel = type === 'thread'
        ? (th.done ? 'Reopen' : 'Picked back up')
        : (th.done ? 'Reopen' : 'Decided');
      const removeLabel = type === 'thread' ? 'Remove' : 'Let it go';
      const timeText = isAged ? `Sitting ${timeAgo(th.time)}` : timeAgo(th.time);
      let remindLine = '';
      if(!th.done && th.remindAt > 0){
        remindLine = `<div class="thread-remind">⏰ ${th.remindAt > Date.now() ? 'Reminder at' : 'Reminder was due'} ${formatWhen(th.remindAt)}</div>`;
      }
      card.innerHTML = `
        <div class="thread-top">
          <p class="thread-cue">${escapeHtml(th.cue)}</p>
          <div class="thread-time">${timeText}</div>
        </div>
        ${remindLine}
        <div class="thread-note">${escapeHtml(th.note)}</div>
        <div class="thread-actions">
          <button class="btn-done">${doneLabel}</button>
          <button class="btn-remove">${removeLabel}</button>
        </div>
      `;
      card.querySelector('.thread-cue').addEventListener('click', () => {
        card.querySelector('.thread-note').classList.toggle('open');
      });
      card.querySelector('.btn-done').addEventListener('click', () => toggleDone(th.id));
      card.querySelector('.btn-remove').addEventListener('click', () => removeThread(th.id));
      container.appendChild(card);
    });
  }

  function render(){
    const threadItems = entries.filter(e => e.type === 'thread');
    const decisionItems = entries.filter(e => e.type === 'decision');
    renderList(threadList, threadLabel, threadItems, 'thread');
    renderList(decisionList, decisionLabel, decisionItems, 'decision');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function saveFromBox(){
    const val = typeArea.value;
    if(!val || !val.trim()) return;
    addThread(val, activeType);
    typeArea.value = '';
    captureHint.textContent = savedMessage(entries[0]);
    captureHint.classList.add('saved-flash');
    setTimeout(() => {
      captureHint.textContent = HINTS[activeType];
      captureHint.classList.remove('saved-flash');
    }, 1400);
  }

  function setActiveType(type){
    activeType = type;
    pillThread.classList.toggle('active', type === 'thread');
    pillDecision.classList.toggle('active', type === 'decision');
    typeArea.placeholder = PLACEHOLDERS[type];
    captureHint.textContent = HINTS[type];
    typeArea.focus();
  }

  pillThread.addEventListener('click', () => setActiveType('thread'));
  pillDecision.addEventListener('click', () => setActiveType('decision'));

  typeSave.addEventListener('click', saveFromBox);

  // Enter key saves (Shift+Enter for a new line), so it works like a quick-capture box
  typeArea.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      saveFromBox();
    }
  });

  loadThreads();
  checkAgedAndNotify();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // --- Local notifications (used only when push isn't set up on this device) ---
  function showNote(title, body){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const opts = { body: body, icon: 'icon-192.png' };
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification(title, opts))
        .catch(() => { try{ new Notification(title, opts); }catch(e){} });
    } else {
      try{ new Notification(title, opts); }catch(e){}
    }
  }

  function checkAgedAndNotify(){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    if(localStorage.getItem('fcm_token')) return; // server push handles reminders
    const now = Date.now();
    const items = entries.filter(e => !e.done && !e.localNotified && (
      (e.remindAt > 0 && e.remindAt <= now) ||
      (!e.remindAt && (now - e.time) > AGE_NUDGE_MS)
    ));
    if(!items.length) return;
    if(items.length === 1){
      showNote(items[0].type === 'decision' ? 'Decision waiting' : 'Pick it back up', items[0].cue);
    } else {
      showNote('JaldiRewind', items.length + ' things are waiting on you.');
    }
    items.forEach(e => { e.localNotified = true; });
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){}
  }

  // --- Firebase Cloud Messaging: lets JaldiRewind receive a push even when fully closed ---
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAF-9YVymxHLztkG4dx1m35HpUx8UscdbE",
    authDomain: "jaldirewind.firebaseapp.com",
    projectId: "jaldirewind",
    storageBucket: "jaldirewind.firebasestorage.app",
    messagingSenderId: "237565993267",
    appId: "1:237565993267:web:597677255f7e577d5cde46"
  };
  const VAPID_KEY = "BIGlC4-CXW8GwbrXf4tzlvm4bwJ7WIZYAcwBdjdtqAIaNWL09xwcqYKUZ-M-uzbjFza9QgTfWYy62HUnXPP3VoU";

  let fcmToken = null;

  async function registerForPush(){
    if(!('serviceWorker' in navigator) || !firebase || !firebase.messaging){
      return { ok:false, reason:'unsupported' };
    }
    try{
      if(!firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      const swReg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      if(!token) return { ok:false, reason:'no-token' };
      fcmToken = token;
      localStorage.setItem('fcm_token', token);
      syncToBackend();
      // Foreground messages (app open in a visible tab) show as a native notification too
      messaging.onMessage((payload) => {
        const d = payload.data || payload.notification || {};
        showNote(d.title || 'JaldiRewind', d.body || '');
      });
      return { ok:true, token };
    }catch(err){
      console.error('FCM registration failed', err);
      return { ok:false, reason:'error', err };
    }
  }

  // Manual enable button, shown only if permission is still undecided
  const enableBtn = document.getElementById('enableNotifs');
  if(enableBtn){
    if(!('Notification' in window) || Notification.permission !== 'default'){
      enableBtn.style.display = 'none';
    } else {
      enableBtn.addEventListener('click', async () => {
        const perm = await Notification.requestPermission();
        if(perm === 'granted'){
          enableBtn.textContent = 'Connecting…';
          const result = await registerForPush();
          if(result.ok){
            enableBtn.textContent = 'Reminders on';
            enableBtn.disabled = true;
            checkAgedAndNotify();
          } else {
            enableBtn.textContent = 'Reminders on (local only)';
            enableBtn.disabled = true;
            checkAgedAndNotify();
          }
        } else {
          enableBtn.textContent = 'Reminders blocked';
        }
      });
    }
  }

  // If permission was already granted in a previous visit, silently (re)register for push
  if('Notification' in window && Notification.permission === 'granted'){
    registerForPush();
  }
})();
</script>
</body>
</html>
